<!doctype html>
<html lang="ja">
<head><script data-aivic-auth-config>window.AIVIC_AUTH = {"region":"us-east-1","userPoolId":"us-east-1_3rXZRVVWI","clientId":"69c58vqgglavkcn3dhvrv25nvb","appId":"stage-d038b63d-48c8-4bc4-8922-bd33c55dc9b3"};window.AIVIC_GATEWAY_URL = "https://5r36haozsl464asvq4tcglhgh40mhkwt.lambda-url.us-east-1.on.aws";</script><script data-aivic-auth-runtime src="./auth/aivic-auth.js"></script>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>営業プロセス・請求データ統合管理システム - ログイン</title>
  <style>
    :root {
      /* Salesforce カラーパレット：深い藍と銀白、洗練された企業向けデザイン */
      /* 明るいテーマ基調で、Salesforceの信頼感と効率性を表現 */
      
      /* プライマリカラー：Salesforce標準の深い藍 */
      --primary: #0070d2;
      --primary-hover: #0056b3;
      
      /* 背景色：クリーンな白ベースに微かな藍の色相を保持 */
      --bg-main: #f7f9fc;
      --bg-card: #ffffff;
      --bg-sidebar: #f3f6fb;
      
      /* ボーダー：Salesforceの洗練された細い線 */
      --border: #d3dce6;
      --border-width: 1px;
      
      /* テキスト：高コントラストの濃紺 */
      --text: #16325c;
      --text-muted: #576d7b;
      
      /* トップバー：Salesforce標準の濃紺ヘッダー */
      --top-bar-bg: #0b5394;
      --top-bar-border: #054098;
      --top-bar-text: #ffffff;
      
      /* タイポグラフィ：Salesforceの標準フォントスタック */
      --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Salesforce Sans', sans-serif;
      
      /* 角丸：Salesforceの控えめで洗練された角丸 */
      --radius-card: 4px;
      --radius-control: 3px;
      
      /* シャドウ：Salesforceの微妙で奥行きのある影 */
      --shadow-card: 0 2px 4px rgba(11, 83, 148, 0.08), 0 1px 2px rgba(11, 83, 148, 0.04);
      
      /* コントロール寸法：Salesforceの標準的なコンパクト設計 */
      --control-height: 32px;
      --space-unit: 8px;
      
      /* アニメーション：Salesforceの洗練された動き */
      --motion-duration: 200ms;
      
      /* 質感：Salesforceの企業向けシステムの信頼感を表現する微細なテクスチャ */
      /* 薄い格子パターンで、データ管理システムの秩序感を表現 */
      --surface-texture: linear-gradient(90deg, rgba(0, 112, 210, 0.02) 1px, transparent 1px),
                         linear-gradient(rgba(0, 112, 210, 0.02) 1px, transparent 1px);
      --surface-texture-size: 16px 16px;
      --surface-texture-position: 0 0;
    }

    [hidden] { display: none !important; }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    body {
      font-family: var(--font-family);
      background: var(--bg-main);
      background-image: var(--surface-texture);
      background-size: var(--surface-texture-size);
      background-position: var(--surface-texture-position);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: calc(var(--space-unit) * 2);
    }

    .login-container {
      width: 100%;
      max-width: 420px;
    }

    .login-card {
      background: var(--bg-card);
      border: var(--border-width) solid var(--border);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      padding: calc(var(--space-unit) * 4);
    }

    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: calc(var(--space-unit) * 3);
      text-align: center;
      color: var(--text);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: calc(var(--space-unit) * 2);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: calc(var(--space-unit) * 1);
    }

    label {
      font-size: 14px;
      font-weight: 500;
      color: var(--text);
    }

    input[type="email"],
    input[type="password"] {
      height: var(--control-height);
      padding: calc(var(--space-unit) * 1) calc(var(--space-unit) * 1.5);
      font-size: 14px;
      border: var(--border-width) solid var(--border);
      border-radius: var(--radius-control);
      font-family: var(--font-family);
      color: var(--text);
      background: var(--bg-card);
      transition: border-color var(--motion-duration), box-shadow var(--motion-duration);
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 112, 210, 0.1);
    }

    button[type="submit"] {
      height: var(--control-height);
      padding: calc(var(--space-unit) * 1) calc(var(--space-unit) * 2);
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: var(--radius-control);
      background: var(--primary);
      color: white;
      cursor: pointer;
      transition: background-color var(--motion-duration);
      font-family: var(--font-family);
    }

    button[type="submit"]:hover {
      background: var(--primary-hover);
    }

    button[type="submit"]:active {
      opacity: 0.9;
    }

    .description {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: calc(var(--space-unit) * 2);
    }

    p[data-testid="login-error"] {
      background: #fef2f1;
      border: var(--border-width) solid #f5a623;
      border-radius: var(--radius-control);
      padding: calc(var(--space-unit) * 1.5);
      font-size: 13px;
      color: #c23030;
      margin-bottom: calc(var(--space-unit) * 2);
      line-height: 1.5;
    }

    @media (max-width: 480px) {
      .login-card {
        padding: calc(var(--space-unit) * 3);
      }

      h1 {
        font-size: 20px;
        margin-bottom: calc(var(--space-unit) * 2);
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h1 data-testid="login-title">ログイン</h1>

      <p data-testid="login-error" role="alert" hidden></p>

      <form data-testid="login-form" novalidate>
        <div class="form-group">
          <label for="username">メールアドレス</label>
          <input type="email" id="username" name="username" autocomplete="username" data-testid="username" required>
        </div>

        <div class="form-group">
          <label for="password">パスワード</label>
          <input type="password" id="password" name="password" autocomplete="current-password" data-testid="password" required>
        </div>

        <button type="submit" data-testid="login-button">ログイン</button>
      </form>

      <form data-testid="new-password-form" novalidate hidden>
        <p class="description">初めてのログインです。新しいパスワードを決めてください（8 文字以上、英大文字・英小文字・数字を含む）</p>

        <div class="form-group">
          <label for="new-password">新しいパスワード</label>
          <input type="password" id="new-password" name="new-password" autocomplete="new-password" data-testid="new-password" required>
        </div>

        <button type="submit" data-testid="new-password-button">パスワードを設定</button>
      </form>
    </div>
  </div>

  <script>
(function () {
  var form = document.querySelector('[data-testid="login-form"]');
  var newPasswordForm = document.querySelector('[data-testid="new-password-form"]');
  var errorBox = document.querySelector('[data-testid="login-error"]');
  function showError(message) { errorBox.textContent = message; errorBox.hidden = !message; }
  function finish() { window.location.href = window.aivicAuth.afterLoginUrl(); }
  newPasswordForm.hidden = true;
  showError("");
  form.addEventListener("submit", function (event) {
    event.preventDefault();
    showError("");
    var email = document.querySelector('[data-testid="username"]').value;
    var password = document.querySelector('[data-testid="password"]').value;
    window.aivicAuth.signIn(email, password).then(function (result) {
      if (result.status === "new_password_required") {
        form.hidden = true;
        newPasswordForm.hidden = false;
        return;
      }
      finish();
    }).catch(function (error) { showError(error.message); });
  });
  newPasswordForm.addEventListener("submit", function (event) {
    event.preventDefault();
    showError("");
    var newPassword = document.querySelector('[data-testid="new-password"]').value;
    window.aivicAuth.completeNewPassword(newPassword).then(finish).catch(function (error) { showError(error.message); });
  });
})();
  </script>
</body>
</html>
