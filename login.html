<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MySF - ログイン画面</title>
  <style>
    :root {
      /* Salesforce カラーパレット：深い藍と銀白、洗練された企業向けデザイン */
      /* 明るいテーマ基調で、Salesforceの信頼感と効率性を表現 */
      
      /* プライマリカラー：Salesforce標準の深い藍 */
      --primary: #0070d2;
      --primary-hover: #0056b3;
      
      /* 背景色：クリーンな白ベースに微かな藍の色相を保持 */
      --bg-main: #f7f9fc;
      --bg-card: #ffffff;
      --bg-sidebar: #f3f6fb;
      
      /* ボーダー：Salesforceの洗練された細い線 */
      --border: #d3dce6;
      --border-width: 1px;
      
      /* テキスト：高コントラストの濃紺 */
      --text: #16325c;
      --text-muted: #576d7b;
      
      /* トップバー：Salesforce標準の濃紺ヘッダー */
      --top-bar-bg: #0b5394;
      --top-bar-border: #054098;
      --top-bar-text: #ffffff;
      
      /* タイポグラフィ：Salesforceの標準フォントスタック */
      --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Salesforce Sans', sans-serif;
      
      /* 角丸：Salesforceの控えめで洗練された角丸 */
      --radius-card: 4px;
      --radius-control: 3px;
      
      /* シャドウ：Salesforceの微妙で奥行きのある影 */
      --shadow-card: 0 2px 4px rgba(11, 83, 148, 0.08), 0 1px 2px rgba(11, 83, 148, 0.04);
      
      /* コントロール寸法：Salesforceの標準的なコンパクト設計 */
      --control-height: 32px;
      --space-unit: 8px;
      
      /* アニメーション：Salesforceの洗練された動き */
      --motion-duration: 200ms;
      
      /* 質感：Salesforceの企業向けシステムの信頼感を表現する微細なテクスチャ */
      /* 薄い格子パターンで、データ管理システムの秩序感を表現 */
      --surface-texture: linear-gradient(90deg, rgba(0, 112, 210, 0.02) 1px, transparent 1px),
                         linear-gradient(rgba(0, 112, 210, 0.02) 1px, transparent 1px);
      --surface-texture-size: 16px 16px;
      --surface-texture-position: 0 0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: var(--font-family);
      background: var(--bg-main);
      background-image: var(--surface-texture);
      background-size: var(--surface-texture-size);
      background-position: var(--surface-texture-position);
      color: var(--text);
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: calc(var(--space-unit) * 2);
    }

    .login-container {
      width: 100%;
      max-width: 420px;
    }

    .login-header {
      text-align: center;
      margin-bottom: calc(var(--space-unit) * 4);
    }

    .login-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
      border-radius: var(--radius-card);
      margin-bottom: calc(var(--space-unit) * 2);
      box-shadow: 0 4px 8px rgba(11, 83, 148, 0.12);
    }

    .login-logo svg {
      width: 28px;
      height: 28px;
      fill: var(--top-bar-text);
    }

    .login-title {
      font-size: 28px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: calc(var(--space-unit) * 1);
      letter-spacing: -0.5px;
    }

    .login-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .login-card {
      background: var(--bg-card);
      border: var(--border-width) solid var(--border);
      border-radius: var(--radius-card);
      padding: calc(var(--space-unit) * 4);
      box-shadow: var(--shadow-card);
    }

    .form-group {
      margin-bottom: calc(var(--space-unit) * 3);
    }

    .form-group:last-of-type {
      margin-bottom: calc(var(--space-unit) * 4);
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: calc(var(--space-unit) * 1);
      letter-spacing: 0.3px;
    }

    .form-input {
      width: 100%;
      height: var(--control-height);
      padding: calc(var(--space-unit) * 1) calc(var(--space-unit) * 1.5);
      font-size: 14px;
      font-family: var(--font-family);
      color: var(--text);
      background: var(--bg-main);
      border: var(--border-width) solid var(--border);
      border-radius: var(--radius-control);
      transition: all var(--motion-duration) ease;
      outline: none;
    }

    .form-input:hover {
      border-color: #a8b8cc;
      background: #fafbfc;
    }

    .form-input:focus {
      border-color: var(--primary);
      background: var(--bg-card);
      box-shadow: 0 0 0 3px rgba(0, 112, 210, 0.1);
    }

    .form-input::placeholder {
      color: #8892a0;
    }

    .login-button {
      width: 100%;
      height: calc(var(--control-height) * 1.25);
      padding: 0;
      font-size: 14px;
      font-weight: 600;
      font-family: var(--font-family);
      color: var(--top-bar-text);
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
      border: none;
      border-radius: var(--radius-control);
      cursor: pointer;
      transition: all var(--motion-duration) ease;
      box-shadow: 0 2px 4px rgba(11, 83, 148, 0.15);
      letter-spacing: 0.3px;
    }

    .login-button:hover {
      background: linear-gradient(135deg, var(--primary-hover) 0%, #003d82 100%);
      box-shadow: 0 4px 8px rgba(11, 83, 148, 0.25);
      transform: translateY(-1px);
    }

    .login-button:active {
      transform: translateY(0);
      box-shadow: 0 1px 2px rgba(11, 83, 148, 0.15);
    }

    .login-footer {
      text-align: center;
      margin-top: calc(var(--space-unit) * 4);
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .login-footer-note {
      display: inline-block;
      background: rgba(0, 112, 210, 0.05);
      border: var(--border-width) solid rgba(0, 112, 210, 0.15);
      border-radius: var(--radius-control);
      padding: calc(var(--space-unit) * 1) calc(var(--space-unit) * 1.5);
      margin-top: calc(var(--space-unit) * 2);
      color: #0056b3;
      font-weight: 500;
    }

    @media (max-width: 480px) {
      .login-container {
        max-width: 100%;
      }

      .login-title {
        font-size: 24px;
      }

      .login-card {
        padding: calc(var(--space-unit) * 3);
      }

      .login-header {
        margin-bottom: calc(var(--space-unit) * 3);
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <div class="login-logo">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/>
        </svg>
      </div>
      <h1 class="login-title" data-testid="login-title">MySF</h1>
      <p class="login-subtitle">営業プロセス・請求データ統合管理システム</p>
    </div>

    <div class="login-card">
      <form data-testid="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="username">ユーザー名</label>
          <input
            class="form-input"
            type="text"
            id="username"
            name="username"
            data-testid="username"
            placeholder="ユーザー名を入力"
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label class="form-label" for="password">パスワード</label>
          <input
            class="form-input"
            type="password"
            id="password"
            name="password"
            data-testid="password"
            placeholder="パスワードを入力"
            autocomplete="current-password"
          >
        </div>

        <button
          class="login-button"
          type="submit"
          data-testid="login-button"
        >
          ログイン
        </button>
      </form>

      <div class="login-footer">
        <div class="login-footer-note">
          ℹ️ サンプル実装ではどの入力でもログインできます
        </div>
      </div>
    </div>
  </div>

  <script>
    document.querySelector('[data-testid="login-form"]').addEventListener('submit', function(e) {
      e.preventDefault();
      window.location.href = './index.html';
    });
  </script>
</body>
</html>
