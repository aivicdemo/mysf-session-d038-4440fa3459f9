:root {

* {

  padding: 0;

}

html, body {

}

body {

  color: var(--text);
  font-size: 14px;

}

.shell-header {

.shell-header-left {

.shell-logo {

.shell-logo-system {

.shell-header-right {

  justify-content: center;
  font-size: 14px;
  font-weight: 600;
  color: var(--top-bar-text);
}

.user-name {
  font-size: 13px;
  color: var(--top-bar-text);
  font-weight: 500;
}

.user-logout {
  font-size: 12px;
  color: rgba(255, 255, 255, 0.8);
  text-decoration: none;
  transition: color var(--motion-duration);
}

.user-logout:hover {
  color: var(--top-bar-text);
}

.shell-body {
  display: flex;
  flex: 1;
  overflow: hidden;
}

.shell-sidebar {
  width: 240px;
  background-color: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
}

.sidebar-nav {
  flex: 1;
  padding: 16px 0;
}

.nav-section {
  padding: 0 8px 16px 8px;
}

.nav-section-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 8px 12px;
  margin-bottom: 4px;
}

.nav-item {
  display: block;
  padding: 10px 12px;
  margin: 2px 0;
  border-radius: var(--radius-control);
  color: var(--text);
  text-decoration: none;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: background-color var(--motion-duration), color var(--motion-duration);
  border-left: 3px solid transparent;
}

.nav-item:hover {
  background-color: rgba(0, 112, 210, 0.06);
}

.nav-item.aivic-active {
  background-color: rgba(0, 112, 210, 0.1);
  color: var(--primary);
  border-left-color: var(--primary);
}

.content-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background-color: var(--bg-main);
}

[data-aivic-panel] {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 24px;
}

@media (max-width: 1024px) {
  .shell-sidebar {
    width: 200px;
  }
  [data-aivic-panel] {
    padding: 16px;
  }
}

@media (max-width: 768px) {
  .shell-body {
    flex-direction: column;
  }
  .shell-sidebar {
    width: 100%;
    height: auto;
    border-right: none;
    border-bottom: 1px solid var(--border);
    max-height: 60px;
    overflow-y: hidden;
    overflow-x: auto;
  }
  .sidebar-nav {
    display: flex;
    gap: 8px;
    padding: 8px 16px;
  }
  .nav-section {
    display: flex;
    gap: 4px;
    padding: 0;
  }
  .nav-section-title {
    display: none;
  }
  .nav-item {
    margin: 0;
    white-space: nowrap;
  }
  [data-aivic-panel] {
    padding: 12px;
  }
}

::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background-color: rgba(0, 112, 210, 0.2);
  border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
  background-color: rgba(0, 112, 210, 0.4);
}

window.AIVIC_PAGE_INIT_JS = "function(container, apiUrl, tables) {\n  const salesTable = tables.find(t => t.tableName === '営業担当者') || { records: [] };\n  const customerTable = tables.find(t => t.tableName === '取引先') || { records: [] };\n  const dealTable = tables.find(t => t.tableName === '商談') || { records: [] };\n  const activityTable = tables.find(t => t.tableName === '営業活動') || { records: [] };\n  \n  const form = {\n    salesPerson: container.querySelector('#sales-person'),\n    customer: container.querySelector('#customer'),\n    deal: container.querySelector('#deal'),\n    activityType: container.querySelector('input[name=\"activity-type\"]'),\n    activityDate: container.querySelector('#activity-date'),\n    activityTime: container.querySelector('#activity-time'),\n    activityCount: container.querySelector('#activity-count'),\n    activityFrequency: container.querySelector('input[name=\"activity-frequency\"]'),\n    activityContent: container.querySelector('#activity-content'),\n    activityResult: container.querySelector('input[name=\"activity-result\"]'),\n    nextAction: container.querySelector('#next-action'),\n    nextFollowDate: container.querySelector('#next-follow-date'),\n    submitBtn: container.querySelector('#btn-submit'),\n    cancelBtn: container.querySelector('#btn-cancel')\n  };\n  \n  function setDefaultDate() {\n    const today = new Date();\n    const yyyy = today.getFullYear();\n    const mm = String(today.getMonth() + 1).padStart(2, '0');\n    const dd = String(today.getDate()).padStart(2, '0');\n    form.activityDate.value = yyyy + '-' + mm + '-' + dd;\n  }\n  \n  function initializeSalesPersons() {\n    const allSales = salesTable.records || [];\n    allSales.forEach(s => {\n      const opt = document.createElement('option');\n      opt.value = s.営業担当者ID || '';\n      opt.textContent = s.名前 || '不明';\n      form.salesPerson.appendChild(opt);\n    });\n    if (allSales.length > 0) {\n      form.salesPerson.value = allSales[0].営業担当者ID;\n    }\n  }\n  \n  function updateCustomers() {\n    const selected = form.salesPerson.value;\n    form.customer.innerHTML = '<option value=\"\">選択してください</option>';\n    if (!selected) return;\n    \n    const customers = customerTable.records || [];\n    customers.forEach(c => {\n      const opt = document.createElement('option');\n      opt.value = c.取引先ID || '';\n      opt.textContent = c.取引先名 || '不明';\n      form.customer.appendChild(opt);\n    });\n  }\n  \n  function updateDeals() {\n    const customerId = form.customer.value;\n    form.deal.innerHTML = '<option value=\"\">選択してください</option>';\n    if (!customerId) return;\n    \n    const deals = (dealTable.records || []).filter(d => d.取引先ID === customerId && d.ステージ !== '成約' && d.ステージ !== '失注');\n    deals.forEach(d => {\n      const opt = document.createElement('option');\n      opt.value = d.商談ID || '';\n      opt.textContent = d.商談名 || '不明';\n      form.deal.appendChild(opt);\n    });\n  }\n  \n  function updateNextFollowDateMin() {\n    if (form.activityDate.value) {\n      const date = new Date(form.activityDate.value);\n      date.setDate(date.getDate() + 1);\n      const yyyy = date.getFullYear();\n      const mm = String(date.getMonth() + 1).padStart(2, '0');\n      const dd = String(date.getDate()).padStart(2, '0');\n      form.nextFollowDate.min = yyyy + '-' + mm + '-' + dd;\n    }\n  }\n  \n  function getFormValues() {\n    return {\n      営業担当者ID: form.salesPerson.value,\n      取引先ID: form.customer.value,\n      商談ID: form.deal.value || null,\n      活動種別: Array.from(container.querySelectorAll('input[name=\"activity-type\"]:checked')).map(r => r.value)[0],\n      活動日時: form.activityDate.value + (form.activityTime.value ? 'T' + form.activityTime.value : 'T09:00'),\n      活動内容: form.activityContent.value,\n      次回フォローアップ予定日: form.nextFollowDate.value ? form.nextFollowDate.value + 'T09:00' : null,\n      商談ステージ: Array.from(container.querySelectorAll('input[name=\"activity-frequency\"]:checked')).map(r => r.value)[0] || '継続',\n      見積金額: 0,\n      成約フラグ: false,\n      作成日時: new Date().toISOString(),\n      作成者ID: form.salesPerson.value,\n      更新日時: new Date().toISOString(),\n      更新者ID: form.salesPerson.value\n    };\n  }\n  \n  function validate() {\n    let isValid = true;\n    const errors = {};\n    \n    if (!form.salesPerson.value) {\n      errors.salesPerson = '営業担当者は必須です';\n      isValid = false;\n    }\n    if (!form.customer.value) {\n      errors.customer = '取引先は必須です';\n      isValid = false;\n    }\n    if (!Array.from(container.querySelectorAll('input[name=\"activity-type\"]:checked')).length) {\n      errors.activityType = '活動タイプは必須です';\n      isValid = false;\n    }\n    if (!form.activityDate.value) {\n      errors.activityDate = '活動日付は必須です';\n      isValid = false;\n    }\n    if (!form.activityCount.value || parseInt(form.activityCount.value) < 1) {\n      errors.activityCount = '活動件数は1以上である必要があります';\n      isValid = false;\n    }\n    if (form.nextFollowDate.value && new Date(form.nextFollowDate.value) <= new Date(form.activityDate.value)) {\n      errors.nextFollowDate = '次回予定日付は活動日付より後の日付を選択してください';\n      isValid = false;\n    }\n    \n    return { isValid, errors };\n  }\n  \n  function clearErrors() {\n    container.querySelectorAll('.form-field').forEach(field => {\n      field.classList.remove('error');\n      const msg = field.querySelector('.error-message');\n      if (msg) msg.classList.remove('show');\n    });\n  }\n  \n  function showErrors(errors) {\n    clearErrors();\n    Object.keys(errors).forEach(key => {\n      let selector = '#' + key;\n      if (key === 'activityType' || key === 'activityFrequency' || key === 'activityResult') {\n        selector = 'input[name=\"' + key.replace(/([A-Z])/g, '-$1').toLowerCase() + '\"]';\n      }\n      const field = container.querySelector(selector)?.closest('.form-field');\n      if (field) {\n        field.classList.add('error');\n        const msg = field.querySelector('.error-message');\n        if (msg) {\n          msg.textContent = errors[key];\n          msg.classList.add('show');\n        }\n      }\n    });\n  }\n  \n  function showSuccess() {\n    const msg = container.querySelector('#success-message');\n    msg.textContent = '営業活動を登録しました';\n    msg.classList.add('show');\n    setTimeout(() => {\n      msg.classList.remove('show');\n      clearForm();\n    }, 2000);\n  }\n  \n  function clearForm() {\n    form.salesPerson.value = salesTable.records[0]?.営業担当者ID || '';\n    form.customer.value = '';\n    form.deal.value = '';\n    form.activityContent.value = '';\n    form.nextAction.value = '';\n    form.nextFollowDate.value = '';\n    form.activityCount.value = '1';\n    form.activityTime.value = '';\n    setDefaultDate();\n    container.querySelector('input[name=\"activity-frequency\"]').checked = false;\n    container.getElementById('freq-continue').checked = true;\n    container.getElementById('result-success').checked = true;\n    container.querySelectorAll('input[name=\"activity-type\"]:checked').forEach(r => r.checked = false);\n    clearErrors();\n    updateCustomers();\n  }\n  \n  // Event Listeners\n  form.salesPerson.addEventListener('change', updateCustomers);\n  form.customer.addEventListener('change', updateDeals);\n  form.activityDate.addEventListener('change', updateNextFollowDateMin);\n  \n  form.submitBtn.addEventListener('click', async () => {\n    const { isValid, errors } = validate();\n    if (!isValid) {\n      showErrors(errors);\n      return;\n    }\n    \n    clearErrors();\n    const values = getFormValues();\n    \n    try {\n      const tableIndex = 2;\n      const saved = await window.aivicApi.save(tableIndex, values);\n      if (saved) {\n        showSuccess();\n      }\n    } catch (err) {\n      console.error('Save error:', err);\n      alert('登録に失敗しました');\n    }\n  });\n  \n  form.cancelBtn.addEventListener('click', clearForm);\n  \n  // Initialize\n  setDefaultDate();\n  initializeSalesPersons();\n  updateCustomers();\n}";
</script>

(function() {

      document.body.appendChild(c);

    }
    function show(msg, type) {
      var c = ensureContainer();
      var el = document.createElement("div");
      el.textContent = msg;
      el.style.cssText = "padding:10px 16px;border-radius:8px;font-size:13px;line-height:1.4;pointer-events:auto;color:#fff;background:" + (type === "error" ? "#dc2626" : "#d97706");
      c.appendChild(el);
      setTimeout(function() {
        el.style.transition = "opacity .3s";
        el.style.opacity = "0";
        setTimeout(function() { if (el.parentNode) el.parentNode.removeChild(el); }, 320);

    function dbErr(op) { window.aivicNotify.error("データベースエラー ( " + op + " ): APIサーバーに接続できません。"); }
    function newId() { return typeof crypto !== "undefined" && crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(36).slice(2); }
    function q(i) {
      var t = TABLE_DEFS[i];
      var dbP = (window.AIVIC_DB_TYPE && window.AIVIC_DB_TYPE !== "dynamodb") ? "&db=" + encodeURIComponent(window.AIVIC_DB_TYPE) : "";

    }
    return {
      list: async function(tableIndex) {
        if (!API_URL) return [];
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex)); var d = await r.json(); return Array.isArray(d) ? d : (d.items || []); }
        catch(e) { dbErr("データ取得"); return []; }
      },
      save: async function(tableIndex, item) {
        if (!API_URL) { dbErr("保存"); return null; }
        var now = new Date().toISOString();
        var rec = Object.assign({}, item, { id: item.id || newId(), createdAt: item.createdAt || now, updatedAt: now });
        try { var r = await fetch(API_URL + "/api/" + tableIndex + q(tableIndex), { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(rec) }); return await r.json(); }
        catch(e) { dbErr("保存"); return null; }
      },
      update: async function(tableIndex, id, changes) {
        if (!API_URL) { dbErr("更新"); return null; }
        try { var r = await fetch(API_URL + "/api/" + tableIndex + "/" + id + q(tableIndex), { method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(Object.assign({}, changes, {updatedAt: new Date().toISOString()})) }); return await r.json(); }
        catch(e) { dbErr("更新"); return null; }

    });
  });

  // 【2026-06-27 強化・必ず閉じられる保証】 モーダル/ダイアログを確実に閉じる安全網。
  //  旧版は Esc のみ + セレクタ .overlay が class="modal-overlay" にマッチせず ( クラストークンが別 )
  //  閉じられなかった ( ユーザー報告 2026-06-27: ダイアログが閉じない ) 。 ① Esc ② オーバーレイ背景クリック
  //  ③ 閉じる系ボタン の 3 経路で閉じる。 セレクタは複合クラスも拾うよう [class*="overlay"] を含む。
  //  閉じ方は「開クラス ( active/open/show 等 ) があれば外す ( 再オープン可 ) 、 無ければ inline display:none」。
  //  modal-header 等の sub-part を誤って隠さないため [class*="modal"] は使わない。
  var AIVIC_OVERLAY_SELECTOR = '[class*="overlay"],[data-aivic-overlay],[data-modal],[role="dialog"],[role="alertdialog"]';
  var aivicCloseOverlay = function(el) {
    if (!el || !el.classList) return;
    var openClasses = ["active", "open", "show", "visible", "is-open", "is-active", "show-modal"];
    var removed = false;
    for (var c = 0; c < openClasses.length; c++) {
      if (el.classList.contains(openClasses[c])) { el.classList.remove(openClasses[c]); removed = true; }
    }
    if (!removed && el.style) el.style.display = "none";
  };
  document.addEventListener("keydown", function(e) {
    if (e.key !== "Escape" && e.keyCode !== 27) return;
    var ov = document.querySelectorAll(AIVIC_OVERLAY_SELECTOR);
    for (var i = 0; i < ov.length; i++) aivicCloseOverlay(ov[i]);
  });
  document.addEventListener("click", function(e) {
    var t = e.target;
    if (!t) return;
    if (t.closest) {
      var closer = t.closest('.modal-close,[data-modal-close],[data-close],[data-dismiss]');
      if (closer) {
        var oc = closer.closest(AIVIC_OVERLAY_SELECTOR);
        if (oc) { aivicCloseOverlay(oc); return; }
      }
    }
    // 背景 ( オーバーレイ要素そのもの ) を直接クリックした時のみ閉じる ( モーダル本体クリックでは閉じない ) 。
    if (t.matches && t.matches(AIVIC_OVERLAY_SELECTOR) && t === e.target) {
      aivicCloseOverlay(t);
    }
  });
  // 【2026-06-28 強化・ロード時に必ず閉じる】 生成 AI が overlay を初期 display:none にし忘れた場合でも、
  //  ロード直後にダイアログが画面を覆って操作不能になる事故 ( ユーザー報告 2026-06-28: ダイアログが常に表示され
  //  閉じられない ) を防ぐ。 認識可能な overlay/dialog セレクタに該当する要素はロード時に必ず閉じる
  //  ( 開クラス除去 or display:none ) 。 真にロード時表示すべき業務コンテンツは overlay セレクタに該当しないため
  //  影響しない ( パネルコンテナは data-aivic-panel で別管理 ) 。
  var aivicHideOverlaysOnLoad = function() {
    var ov = document.querySelectorAll(AIVIC_OVERLAY_SELECTOR);
    for (var i = 0; i < ov.length; i++) aivicCloseOverlay(ov[i]);
  };
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", aivicHideOverlaysOnLoad);
  } else {
    aivicHideOverlaysOnLoad();
  }
})();

</script>
</body>
</html>
